# FedDeck - Hyprland Configuration
# Cohesive, minimal, beautiful desktop

# ======================================
# MONITORS
# ======================================
monitor=eDP-1,1920x1080@60,0x0,1

# ======================================
# INPUT DEVICES
# ======================================
input {
    kb_layout=us
    kb_variant=
    kb_model=
    kb_options=
    kb_rules=

    follow_mouse=1

    touchpad {
        natural_scroll=yes
        disable_while_typing=yes
        tap-to-click=yes
    }

    sensitivity=0
    accel_profile=flat
}

# ======================================
# GENERAL
# ======================================
general {
    gaps_in=5
    gaps_out=10
    border_size=2
    col.active_border=rgba(ffffffee)
    col.inactive_border=rgba(00000044)

    layout=dwindle
    allow_tearing=false

    resize_on_border=true
    extend_border_grab_area=15
}

# ======================================
# DECORATION
# ======================================
decoration {
    rounding=10
    blur {
        enabled=true
        size=8
        passes=3
        new_optimizations=true
    }

    drop_shadow=yes
    shadow_range=20
    shadow_render_power=3
    col.shadow=rgba(00000055)

    dim_inactive=false
}

# ======================================
# ANIMATIONS
# ======================================
animations {
    enabled=true

    bezier=easeInOut,0.4,0.0,0.2,1
    bezier=easeOut,0.0,0.0,0.2,1
    bezier=easeIn,0.4,0.0,1.0,1

    animation=windows,1,5,easeInOut
    animation=border,1,5,easeInOut
    animation=fade,1,5,easeInOut
    animation=workspaces,1,5,easeInOut
}

# ======================================
# LAYOUT
# ======================================
dwindle {
    pseudotile=0
    preserve_split=0
    smart_split=false
    smart_resizing=true
}

# ======================================
# WINDOW RULES
# ======================================
windowrulev2=suppressevent maximize, class:.* # You'll probably like this.
windowrule=float, ^(fcitx)$
windowrule=float, ^(wlogout)$
windowrule=float, ^(pavucontrol)$
windowrule=float, ^(blueman-manager)$

# ======================================
# ENVIRONMENT
# ======================================
env=XDG_CURRENT_DESKTOP=Hyprland
env=XDG_SESSION_TYPE=wayland
env=XDG_SESSION_DESKTOP=Hyprland

# Wayland portal
env=QT_QPA_PLATFORM=wayland
env=SDL_VIDEODRIVER=wayland
env=_JAVA_AWT_WM_NONREPARENTING=1

# GTK
env=GDK_BACKEND=wayland

# Electron
env=ELECTRON_OZONE_PLATFORM_HINT=wayland

# Firefox
env=MOZ_ENABLE_WAYLAND=1

# ======================================
# EXECUTION
# ======================================
# Start the custom Quickshell shell
exec-once=quickshell

# System utilities
exec-once=waybar &
exec-once=dunst &
exec-once=blueman-applet &
exec-once=nm-applet &
exec-once=swayidle -w &
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# ======================================
# KEYBINDINGS
# ======================================
# Modifier keys
$mod=SUPER

# Terminal
bind=$mod,Return,exec,kitty

# Application launcher
bind=$mod,D,exec,wofi --show drun

# Kill active window
bind=$mod,SHIFT,Q,killactive

# Exit Hyprland
bind=$mod,SHIFT,E,exec,wlogout

# Reload config
bind=$mod,SHIFT,R,exec,hyprctl reload

# Move focus
bind=$mod,left,movefocus,l
bind=$mod,right,movefocus,r
bind=$mod,up,movefocus,u
bind=$mod,down,movefocus,d

# Move window
bind=$mod,SHIFT,left,movewindow,l
bind=$mod,SHIFT,right,movewindow,r
bind=$mod,SHIFT,up,movewindow,u
bind=$mod,SHIFT,down,movewindow,d

# Resize window
binde=$mod,CTRL,left,resizewindow,-20
binde=$mod,CTRL,right,resizewindow,20
binde=$mod,CTRL,up,resizewindow,-20
binde=$mod,CTRL,down,resizewindow,20

# Workspace switching
bind=$mod,1,workspace,1
bind=$mod,2,workspace,2
bind=$mod,3,workspace,3
bind=$mod,4,workspace,4
bind=$mod,5,workspace,5

# Move to workspace
bind=$mod,SHIFT,1,movetoworkspace,1
bind=$mod,SHIFT,2,movetoworkspace,2
bind=$mod,SHIFT,3,movetoworkspace,3
bind=$mod,SHIFT,4,movetoworkspace,4
bind=$mod,SHIFT,5,movetoworkspace,5

# Toggle fullscreen
bind=$mod,F,fullscreen,0

# Toggle floating
bind=$mod,SPACE,togglefloating

# Screenshot
bind=$mod,Print,exec,grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind=$mod,SHIFT,Print,exec,grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Volume
bind=,XF86AudioRaiseVolume,exec,pamixer -i 5
bind=,XF86AudioLowerVolume,exec,pamixer -d 5
bind=,XF86AudioMute,exec,pamixer -t

# Brightness
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5%
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5-

# Media
bind=,XF86AudioPlay,exec,playerctl play-pause
bind=,XF86AudioNext,exec,playerctl next
bind=,XF86AudioPrev,exec,playerctl previous
